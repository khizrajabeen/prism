<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoBrain</title>
<!-- Inline so the page makes zero external requests, favicon included. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%230f766e'/><circle cx='11' cy='13' r='2.6' fill='%23fff'/><circle cx='21' cy='11' r='2.2' fill='%23fff'/><circle cx='19' cy='22' r='2.4' fill='%23fff'/><path d='M11 13L21 11M21 11L19 22M19 22L11 13' stroke='%23fff' stroke-width='1.4' fill='none' opacity='.75'/></svg>">
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --bg: #f7f8fa;  --surface: #ffffff;  --surface-2: #f1f3f6;
  --border: #e2e6ec; --border-strong: #cbd2dc;
  --text: #16191d;  --muted: #5d6773;  --faint: #8b95a2;
  --accent: #0f766e; --accent-soft: #ccfbf1; --accent-text: #0b5b55;
  --warn: #b45309;  --warn-soft: #fef3c7;
  --danger: #b42318; --danger-soft: #fee4e2;
  --ok: #067647;    --ok-soft: #dcfce7;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --surface: #161b22; --surface-2: #1c222b;
    --border: #272e39; --border-strong: #39424f;
    --text: #e6edf3; --muted: #9aa6b4; --faint: #6e7a89;
    --accent: #2dd4bf; --accent-soft: #10322f; --accent-text: #5eead4;
    --warn: #fbbf24; --warn-soft: #3a2c07;
    --danger: #fca5a5; --danger-soft: #3d1513;
    --ok: #4ade80; --ok-soft: #10301d;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: var(--mono); font-size: 13px; }

/* ---------------------------------------------------------------- layout */
.app { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
nav {
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 8px 16px; }
.brand b { font-size: 17px; letter-spacing: -.02em; }
.brand span { font-size: 11px; color: var(--faint); }
nav button {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 1px;
}
nav button:hover { background: var(--surface-2); color: var(--text); }
nav button.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
nav button .badge {
  margin-left: auto; background: var(--danger-soft); color: var(--danger);
  font-size: 11px; padding: 1px 6px; border-radius: 10px; font-weight: 600;
}
nav .group { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--faint); padding: 16px 10px 6px; font-weight: 600; }

main { padding: 26px 30px 60px; max-width: 1180px; overflow-x: hidden; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
h2 { font-size: 16px; margin: 26px 0 10px; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; max-width: 70ch; }

/* --------------------------------------------------------------- widgets */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; }
.stat .n { font-size: 26px; font-weight: 650; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stat .h { font-size: 11.5px; color: var(--faint); margin-top: 6px; }

input, select, textarea, button.btn {
  font: inherit; padding: 8px 11px; border: 1px solid var(--border-strong);
  border-radius: 8px; background: var(--surface); color: var(--text); width: 100%;
}
textarea { resize: vertical; min-height: 76px; font-family: var(--sans); }
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent;
}
button.btn { width: auto; cursor: pointer; font-weight: 550; }
button.btn:hover { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { button.primary { color: #08211f; } }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
button.sm { padding: 5px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > input { flex: 1; min-width: 200px; }

.pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11.5px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }

.hit { border-bottom: 1px solid var(--border); padding: 14px 0; }
.hit:last-child { border-bottom: 0; }
.hit .t { font-weight: 600; margin-bottom: 3px; }
.hit .m { font-size: 12px; color: var(--faint); margin-bottom: 7px; }
.hit .s { font-size: 13.5px; color: var(--muted); }
mark { background: var(--accent-soft); color: var(--accent-text); padding: 0 2px;
  border-radius: 3px; }

pre.md { white-space: pre-wrap; word-wrap: break-word; font-size: 13px;
  line-height: 1.6; margin: 0; font-family: var(--mono); }
.scroll { max-height: 62vh; overflow-y: auto; }
.diff { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap;
  background: var(--surface-2); padding: 12px; border-radius: 8px;
  border: 1px solid var(--border); overflow-x: auto; }
.diff .add { color: var(--ok); }
.diff .del { color: var(--danger); }
.empty { color: var(--faint); font-size: 14px; padding: 22px 0; text-align: center; }
.note { font-size: 12.5px; color: var(--muted); background: var(--surface-2);
  border-left: 3px solid var(--border-strong); padding: 9px 12px;
  border-radius: 0 6px 6px 0; margin: 10px 0; }
.note.warn { border-left-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--faint); border-bottom: 1px solid var(--border); padding: 7px 8px; font-weight: 600; }
td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
canvas { width: 100%; height: 460px; display: block; border-radius: 8px;
  background: var(--surface-2); cursor: grab; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
  margin-top: 10px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block;
  margin-right: 4px; vertical-align: middle; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border-strong);
  border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 780px) {
  .app { grid-template-columns: 1fr; }
  nav { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; }
  nav button { width: auto; }
  nav .group, .brand { width: 100%; }
  main { padding: 18px 16px 50px; }
}
</style>
</head>
<body>
<div class="app">
  <!--
    Six tabs, one per stage of the loop researchers actually run:
      question → evidence → hypothesis → experiment → result → belief
    Everything that used to be its own tab (entity graph, digest, conflicts,
    review, models, quiz) was a *mechanism*, not a destination. Mechanisms are
    now lenses inside the stage where you would reach for them.
  -->
  <nav>
    <div class="brand"><b>NeoBrain</b><span id="ver">local</span></div>
    <button data-v="today" class="on">Today <span class="badge" id="b-today" hidden>0</span></button>
    <button data-v="ask">Ask</button>
    <button data-v="research">Research</button>
    <button data-v="projects">Projects</button>
    <button data-v="library">Library</button>
    <button data-v="bench">Bench</button>
    <button data-v="memory">Memory <span class="badge" id="b-mem" hidden>0</span></button>
    <div class="group" style="margin-top:auto">Loop</div>
    <div style="font-size:11px;color:var(--faint);padding:0 10px 14px;line-height:1.7">
      question → evidence<br>→ hypothesis → experiment<br>→ result → belief
    </div>
  </nav>
  <main id="main"><div class="empty"><span class="spin"></span> loading…</div></main>
</div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token");
const $ = (s, r = document) => r.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = n => (n ?? 0).toLocaleString();

async function api(path, opts = {}) {
  const url = new URL(path, location.origin);
  if (TOKEN) url.searchParams.set("token", TOKEN);
  for (const [k, v] of Object.entries(opts.params || {}))
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  const r = await fetch(url, {
    method: opts.body ? "POST" : "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  return r.json();
}

const main = $("#main");
// Views render into an explicit target so they can be either a whole page or a
// panel inside a tab. Passing the target beats a module-level "current target",
// which breaks the moment a view awaits.
const into = (T, ...nodes) => (T || main).replaceChildren(...nodes.flat());
const busy = (T, msg = "loading") => into(T,
  el("div", { class: "empty" }, el("span", { class: "spin" }), " " + msg + "…"));
const head = (title, sub) => [el("h1", {}, title), sub && el("p", { class: "sub" }, sub)];

/* A tabbed shell. `panels` is [{id, label, render(container)}]. */
function shell(title, sub, panels, initial) {
  const bar = el("div", { class: "row", style: "gap:6px;margin-bottom:16px;flex-wrap:wrap" });
  const body = el("div", {});
  let current = initial || panels[0].id;
  const paint = () => {
    bar.replaceChildren(...panels.map(pn => el("button", {
      class: "btn sm" + (pn.id === current ? " primary" : ""),
      onclick: () => { current = pn.id; paint(); body.replaceChildren(); pn.render(body); },
    }, pn.label)));
  };
  paint();
  into(null, ...head(title, sub), bar, body);
  (panels.find(pn => pn.id === current) || panels[0]).render(body);
}

// --------------------------------------------------------------- overview
async function viewOverview(T) {
  busy(T);
  const s = await api("/api/stats");
  const env = s.environment || {};
  const stat = (n, l, h) => el("div", { class: "stat" },
    el("div", { class: "n" }, num(n)), el("div", { class: "l" }, l),
    h && el("div", { class: "h" }, h));

  const nodes = [
    ...head("Overview", "What is in the brain, and what needs your attention."),
    el("div", { class: "grid g4" },
      stat(s.papers, "papers", `${num(s.papers_oa)} open access · ${num(s.fulltext)} full text`),
      stat(s.chunks, "indexed passages", s.embeddings ? `${num(s.embeddings)} embedded` : "keyword + graph"),
      stat(s.journal, "memories", s.journal_since ? "since " + String(s.journal_since).slice(0, 10) : "none yet"),
      stat(s.beliefs, "active beliefs", `${s.beliefs_due} due for re-check`),
      stat(s.entities, "entities", `${num(s.entity_edges)} graph edges`),
      stat(s.trials, "trials", `${num(s.trial_changes)} status changes`),
      stat(s.rules, "learned rules", "procedural memory"),
      stat(s.cards_due, "cards due", `${num(s.cards)} in deck`),
    ),
  ];

  if (s.proposals_pending > 0 || s.conflicts_open > 0) {
    nodes.push(el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Needs you"),
      s.proposals_pending > 0 && el("p", {},
        `${s.proposals_pending} memory edit(s) awaiting approval. `,
        el("button", { class: "btn sm primary", onclick: () => go("review") }, "Review")),
      s.conflicts_open > 0 && el("p", {},
        `${s.conflicts_open} passage(s) may contradict stored beliefs. `,
        el("button", { class: "btn sm", onclick: () => go("conflicts") }, "Inspect")),
    ));
  }

  nodes.push(el("div", { class: "card" },
    el("h2", { style: "margin-top:0" }, "This machine"),
    el("p", { class: "sub", style: "margin:0" }, env.note || ""),
    el("div", { class: "row", style: "margin-top:8px" },
      el("span", { class: "pill " + (env.gpu ? "ok" : "") }, env.gpu ? `GPU ${env.vram_gb || "?"} GB` : "CPU only"),
      el("span", { class: "pill" }, `${(env.installed || []).length}/${env.registered || 0} registered models installed`),
      el("button", { class: "btn sm", onclick: () => go("models") }, "Model registry"),
    )));

  const brief = await api("/api/brief");
  nodes.push(el("div", { class: "card" },
    el("h2", { style: "margin-top:0" }, "Session brief"),
    el("p", { class: "sub" }, "Exactly what your agent reads at the start of a session."),
    el("div", { class: "scroll" }, el("pre", { class: "md" }, brief.markdown || ""))));

  into(T, nodes);
  refreshBadges(s);
}

function refreshBadges(s, sci) {
  const set = (id, n) => { const b = $(id); if (!b) return;
    b.hidden = !n; b.textContent = n; };
  set("#b-mem", (s.proposals_pending || 0) + (s.conflicts_open || 0));
  set("#b-today", (sci && sci.awaiting_result) || 0);
}

// ----------------------------------------------------------------- search
let lastQuery = "";
async function viewSearch(T) {
  const input = el("input", { placeholder: "e.g. why is the adjuvant-alone control important?",
    value: lastQuery, onkeydown: e => { if (e.key === "Enter") run(); } });
  const kind = el("select", {},
    el("option", { value: "" }, "everything"),
    el("option", { value: "paper" }, "papers only"),
    el("option", { value: "knowledge" }, "my notes only"));
  const results = el("div", {});

  async function run(mode = "search") {
    const q = input.value.trim();
    if (!q) return;
    lastQuery = q;
    results.replaceChildren(el("div", { class: "empty" }, el("span", { class: "spin" }), " searching…"));
    if (mode === "evidence") {
      const r = await api("/api/evidence", { params: { q } });
      results.replaceChildren(el("div", { class: "card" },
        el("div", { class: "scroll" }, el("pre", { class: "md" }, r.markdown || ""))));
      return;
    }
    const r = await api("/api/search", { params: { q, k: 12, kind: kind.value } });
    if (!r.hits?.length) {
      results.replaceChildren(el("div", { class: "card" },
        el("div", { class: "empty" }, "Nothing in the corpus matches."),
        el("div", { class: "note" },
          "That is a fact about the corpus, not about the literature. Widen "
          + "config/interests.yaml, or run a longer sweep.")));
      return;
    }
    const terms = q.toLowerCase().match(/[a-z0-9]{4,}/g) || [];
    const hl = t => esc(t).replace(new RegExp("(" + terms.map(x =>
      x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi"), "<mark>$1</mark>");
    results.replaceChildren(el("div", { class: "card" }, r.hits.map(h =>
      el("div", { class: "hit" },
        el("div", { class: "t" }, h.url ? el("a", { href: h.url, target: "_blank", rel: "noopener" }, h.title) : h.title),
        el("div", { class: "m" },
          h.citation, " · § ", h.heading || "—", " · ",
          el("span", { class: "pill acc" }, (h.how || []).join("+")),
          h.tier !== null && h.tier !== undefined ? " " : "",
          h.tier !== null && h.tier !== undefined
            ? el("span", { class: "pill " + (h.tier >= 4 ? "ok" : h.tier <= 1 ? "warn" : "") }, "tier " + h.tier + "/5")
            : null),
        el("div", { class: "s", html: hl(h.snippet) })))));
  }

  into(T, [
    ...head("Search", "Hybrid retrieval: keyword + entity graph" +
      " (+ vectors when enabled), fused by rank."),
    el("div", { class: "card" },
      el("div", { class: "row" }, input, kind,
        el("button", { class: "btn primary", onclick: () => run() }, "Search"),
        el("button", { class: "btn", onclick: () => run("evidence") }, "Evidence pack")),
      el("div", { class: "note" },
        "“Evidence pack” builds the citable block an agent should answer from — "
        + "sources, evidence tiers, existing beliefs, and an explicit strength read.")),
    results,
  ]);
  if (lastQuery) run();
}

// ------------------------------------------------------------------ graph
const KIND_COLORS = { gene: "#e0724a", hla: "#7c5cd6", cell_line: "#0f8f84",
  mouse: "#c2810f", tool: "#3b7dd8", assay: "#c2418a", concept: "#5d6773",
  mutation: "#b42318" };

async function viewGraph(T) {
  const input = el("input", { placeholder: "centre on an entity, e.g. CT26 (blank = most mentioned)" });
  const from = el("input", { placeholder: "from, e.g. CT26" });
  const to = el("input", { placeholder: "to, e.g. immunodominance" });
  const canvas = el("canvas");
  const info = el("div", {});
  const pathOut = el("div", {});

  async function draw() {
    const r = await api("/api/graph", { params: { entity: input.value.trim(), limit: 55 } });
    if (r.error) { info.replaceChildren(el("div", { class: "note warn" }, r.error)); return; }
    info.replaceChildren(el("div", { class: "legend" },
      ...Object.entries(KIND_COLORS).map(([k, c]) =>
        el("span", {}, el("i", { style: `background:${c}` }), k.replace("_", " ")))));
    layout(canvas, r.nodes, r.edges, r.centre);
  }

  async function findPath() {
    if (!from.value.trim() || !to.value.trim()) return;
    const r = await api("/api/graph-path", { params: { from: from.value.trim(), to: to.value.trim() } });
    pathOut.replaceChildren(el("div", { class: "card" },
      el("div", { style: "font-size:17px;font-weight:600;letter-spacing:-.01em" },
        r.path ? r.path.join("  →  ") : "no path found"),
      el("div", { class: "note" }, r.note)));
  }

  into(T, [
    ...head("Entity graph", "Passages connected to a question through the literature's own "
      + "structure, not through wording. This is what answers multi-hop questions."),
    el("div", { class: "card" },
      el("div", { class: "row" }, input,
        el("button", { class: "btn primary", onclick: draw }, "Show")),
      canvas, info),
    el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Find a path"),
      el("div", { class: "row" }, from, to,
        el("button", { class: "btn", onclick: findPath }, "Trace")),
      el("div", { class: "note" },
        "A co-occurrence path is a lead, not a causal claim: it means these concepts are "
        + "discussed together through these intermediates.")),
    pathOut,
  ]);
  draw();
}

/* Minimal force-directed layout. ~60 lines beats a 200KB dependency. */
function layout(canvas, nodes, edges, centre) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  if (!nodes.length) {
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--faint");
    ctx.font = "14px system-ui"; ctx.textAlign = "center";
    ctx.fillText("No entities yet — run a sweep, or `neobrain graph --rebuild`.", W / 2, H / 2);
    return;
  }
  const idx = new Map(nodes.map((n, i) => [n.id, i]));
  const P = nodes.map((n, i) => ({
    x: W / 2 + Math.cos(i / nodes.length * 6.283) * Math.min(W, H) * 0.32 + (Math.random() - .5) * 30,
    y: H / 2 + Math.sin(i / nodes.length * 6.283) * Math.min(W, H) * 0.32 + (Math.random() - .5) * 30,
    vx: 0, vy: 0,
  }));
  const E = edges.map(e => ({ a: idx.get(e.a), b: idx.get(e.b), w: e.weight }))
                 .filter(e => e.a !== undefined && e.b !== undefined);
  const maxW = Math.max(...E.map(e => e.w), 0.001);
  const maxM = Math.max(...nodes.map(n => n.n_mentions), 1);
  const rad = n => 4 + 9 * Math.sqrt(n.n_mentions / maxM);

  for (let step = 0; step < 340; step++) {
    for (let i = 0; i < P.length; i++) {           // repulsion
      for (let j = i + 1; j < P.length; j++) {
        let dx = P[j].x - P[i].x, dy = P[j].y - P[i].y;
        let d2 = dx * dx + dy * dy || 0.01;
        const f = 5200 / d2;
        const d = Math.sqrt(d2);
        P[i].vx -= f * dx / d; P[i].vy -= f * dy / d;
        P[j].vx += f * dx / d; P[j].vy += f * dy / d;
      }
    }
    for (const e of E) {                            // attraction
      const dx = P[e.b].x - P[e.a].x, dy = P[e.b].y - P[e.a].y;
      const d = Math.hypot(dx, dy) || 0.01;
      const f = (d - 70) * 0.012 * (0.4 + e.w / maxW);
      P[e.a].vx += f * dx / d; P[e.a].vy += f * dy / d;
      P[e.b].vx -= f * dx / d; P[e.b].vy -= f * dy / d;
    }
    for (const p of P) {                            // integrate + centre pull
      p.vx += (W / 2 - p.x) * 0.0016; p.vy += (H / 2 - p.y) * 0.0016;
      p.x += (p.vx *= 0.82); p.y += (p.vy *= 0.82);
      p.x = Math.max(24, Math.min(W - 24, p.x));
      p.y = Math.max(20, Math.min(H - 20, p.y));
    }
  }

  const css = getComputedStyle(document.body);
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = css.getPropertyValue("--border-strong").trim() || "#ccc";
  for (const e of E) {
    ctx.globalAlpha = 0.15 + 0.55 * (e.w / maxW);
    ctx.lineWidth = 0.5 + 1.8 * (e.w / maxW);
    ctx.beginPath(); ctx.moveTo(P[e.a].x, P[e.a].y); ctx.lineTo(P[e.b].x, P[e.b].y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Draw every node, then labels in importance order with collision rejection.
  // A crowded graph where labels overlap into mush is less readable than one
  // where the minor nodes are simply unlabelled and hoverable.
  nodes.forEach((n, i) => {
    const isCentre = centre && n.name.toLowerCase() === centre.toLowerCase();
    ctx.beginPath(); ctx.arc(P[i].x, P[i].y, rad(n), 0, 6.284);
    ctx.fillStyle = KIND_COLORS[n.kind] || "#888"; ctx.fill();
    if (isCentre) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = css.getPropertyValue("--text").trim() || "#111";
      ctx.stroke();
    }
  });

  const order = nodes.map((n, i) => ({ n, i,
    key: (centre && n.name.toLowerCase() === centre.toLowerCase()) ? 1e9 : n.n_mentions }))
    .sort((a, b) => b.key - a.key);
  const placed = [];
  ctx.textAlign = "center";
  for (const { n, i } of order) {
    const isCentre = centre && n.name.toLowerCase() === centre.toLowerCase();
    ctx.font = (isCentre ? "600 " : "") + "11px system-ui";
    const label = n.name.length > 20 ? n.name.slice(0, 19) + "…" : n.name;
    const w = ctx.measureText(label).width, h = 12;
    const x = P[i].x, y = P[i].y - rad(n) - 5;
    const box = { l: x - w / 2 - 2, r: x + w / 2 + 2, t: y - h, b: y + 3 };
    if (!isCentre && placed.some(p =>
        box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t)) continue;
    placed.push(box);
    ctx.fillStyle = css.getPropertyValue("--text").trim() || "#111";
    ctx.fillText(label, x, y);
  }
  canvas.title = nodes.length + " entities — unlabelled nodes are lower-mention; "
    + "centre the graph on one to see its neighbourhood.";
}

// ---------------------------------------------------------------- journal
async function viewJournal(T) {
  const q = el("input", { placeholder: "search everything ever recorded…",
    onkeydown: e => { if (e.key === "Enter") load(); } });
  const text = el("textarea", { placeholder: "What should be remembered permanently?" });
  const kind = el("select", {}, ...["observation", "correction", "decision", "preference",
    "result", "question", "error"].map(k => el("option", { value: k }, k)));
  const imp = el("select", {}, ...[1, 2, 3, 4, 5].map(i =>
    el("option", { value: i, selected: i === 2 ? "" : null }, "importance " + i)));
  const list = el("div", {});

  async function load() {
    const r = await api("/api/journal", { params: { q: q.value.trim(), n: 60 } });
    const s = r.stats || {};
    list.replaceChildren(el("div", { class: "card" },
      el("div", { class: "m", style: "font-size:12px;color:var(--faint);margin-bottom:10px" },
        `${num(s.total)} entries since ${String(s.since || "").slice(0, 10) || "—"}`),
      r.entries.length ? r.entries.map(e => el("div", { class: "hit" },
        el("div", { class: "m" },
          el("span", { class: "pill" }, e.kind), " ",
          String(e.at).slice(0, 16).replace("T", " "),
          e.topic ? " · " + e.topic : "", e.source ? " · " + e.source : ""),
        el("div", { class: "s", style: "color:var(--text)" }, e.text)))
        : el("div", { class: "empty" }, "Nothing recorded yet.")));
  }

  async function save() {
    if (!text.value.trim()) return;
    await api("/api/journal", { body: { text: text.value, kind: kind.value,
      importance: Number(imp.value) } });
    text.value = ""; load();
  }

  into(T, [
    ...head("Journal", "Append-only episodic memory. Recorded immediately, "
      + "and the database itself refuses to edit or delete it."),
    el("div", { class: "card" },
      text,
      el("div", { class: "row", style: "margin-top:9px" }, kind, imp,
        el("button", { class: "btn primary", onclick: save }, "Remember")),
      el("div", { class: "note" },
        "Importance 4+ appears in every future session brief. Entries are records "
        + "that something was said — they are not authoritative, and are never cited as fact.")),
    el("div", { class: "card" }, el("div", { class: "row" }, q,
      el("button", { class: "btn", onclick: load }, "Search"))),
    list,
  ]);
  load();
}

async function viewReview(T) {
  busy(T);
  const r = await api("/api/proposals");
  const render = list => into(T, [
    ...head("Review", "The approval gate. The agent proposes; nothing enters authoritative "
      + "memory until you approve the diff."),
    list.length ? list.map(p => {
      const note = el("input", { placeholder: "note (optional)" });
      const box = el("div", { class: "card" },
        el("div", { class: "row", style: "justify-content:space-between" },
          el("div", {}, el("span", { class: "pill acc" }, p.kind), " → ", el("b", {}, p.target)),
          el("span", { class: "m", style: "font-size:12px;color:var(--faint)" },
            String(p.created_at).slice(0, 16).replace("T", " "))),
        el("p", { class: "sub", style: "margin:10px 0 4px" }, p.rationale),
        p.evidence && el("div", { class: "m", style: "font-size:12px;color:var(--faint)" },
          "evidence: " + p.evidence),
        el("div", { class: "diff", html: (p.diff || "").split("\n").map(l =>
          l.startsWith("+") ? `<span class="add">${esc(l)}</span>` :
          l.startsWith("-") ? `<span class="del">${esc(l)}</span>` : esc(l)).join("\n") }),
        el("div", { class: "row", style: "margin-top:10px" }, note,
          el("button", { class: "btn primary", onclick: () => decide(p.id, "apply", note.value) }, "Apply"),
          el("button", { class: "btn", onclick: () => decide(p.id, "reject", note.value) }, "Reject")));
      return box;
    }) : el("div", { class: "card" }, el("div", { class: "empty" }, "Nothing awaiting approval.")),
  ]);

  async function decide(id, decision, note) {
    await api("/api/proposals/decide", { body: { id, decision, note } });
    viewReview(T);
    api("/api/today").then(d => refreshBadges(d.stats||{}, d.science||{}));
  }
  render(r.proposals || []);
}

// -------------------------------------------------------------- conflicts
async function viewConflicts(T, scan) {
  busy(T, scan ? "scanning the corpus" : "loading");
  const r = await api("/api/conflicts", { params: { scan: scan ? 1 : 0 } });
  into(T, [
    ...head("Conflicts", "Evidence that may contradict what the brain believes."),
    el("div", { class: "card" },
      el("div", { class: "row" },
        el("button", { class: "btn primary", onclick: () => viewConflicts(T, true) }, "Re-scan corpus")),
      el("div", { class: "note" },
        "A deliberately over-sensitive detector — shared entities plus negation cues plus "
        + "numeric divergence. These are candidates, never verdicts. Dismissing a false "
        + "positive costs five seconds; a missed contradiction costs a wrong claim in a paper.")),
    (r.conflicts || []).length ? r.conflicts.map(c => {
      const box = el("div", { class: "card" },
        el("div", {}, el("span", { class: "pill warn" }, "against belief"), " ", el("b", {}, c.claim)),
        el("div", { class: "m", style: "font-size:12.5px;color:var(--faint);margin:8px 0" },
          "cue: ", c.cue),
        c.title && el("div", { class: "m", style: "font-size:12.5px" },
          "in: ", c.url ? el("a", { href: c.url, target: "_blank", rel: "noopener" }, c.title) : c.title,
          c.evidence_tier !== null && c.evidence_tier !== undefined ? ` (tier ${c.evidence_tier}/5)` : ""),
        el("div", { class: "s", style: "margin-top:8px;color:var(--muted)" }, c.passage),
        el("div", { class: "row", style: "margin-top:10px" },
          el("button", { class: "btn sm primary", onclick: () => resolve(c.id, "resolved") }, "Real — resolved"),

}

async function viewTools(T) {
  const prot = el("textarea", { placeholder: "Protein sequence (one-letter code)" });
  const pos = el("input", { type: "number", placeholder: "position (1-based)", value: "12" });
  const mut = el("input", { placeholder: "mutant residue, e.g. D", value: "D" });
  const wt = el("input", { placeholder: "expected wild-type (optional, catches isoform mismatch)" });
  const out1 = el("div", {});

  const eps = el("textarea", { placeholder: "One epitope per line, in construct order" });
  const linker = el("input", { value: "AAY", placeholder: "linker, e.g. AAY / GPGPG / blank" });
  const out2 = el("div", {});

  const allele = el("input", { placeholder: "e.g. A*0201 or HLA-DRB1*15:01" });
  const out3 = el("div", {});

  async function windows() {
    const r = await api("/api/peptides/windows", { body: {
      protein: prot.value, position: Number(pos.value), mutant_aa: mut.value,
      wildtype_aa: wt.value.trim() || null, lengths: [8, 9, 10, 11] } });
    if (r.error) { out1.replaceChildren(el("div", { class: "note warn" }, r.error)); return; }
    out1.replaceChildren(el("div", { class: "card" },
      el("p", { class: "sub" }, `${r.count} peptides containing the mutation, each with its wild-type control.`),
      el("table", {}, el("tr", {}, ...["mutant", "len", "mut pos", "wild-type", "position type"]
        .map(h => el("th", {}, h))),
        ...r.windows.map(w => el("tr", {},
          el("td", { class: "mono" }, w.peptide),
          el("td", {}, w.length),
          el("td", {}, "P" + w.mutation_position),
          el("td", { class: "mono", style: "color:var(--muted)" }, w.wildtype),
          el("td", {}, el("span", { class: "pill " + (w.is_anchor ? "warn" : "acc") },
            w.is_anchor ? "anchor" : "TCR-facing")))))));
  }

  async function junctions() {
    const list = eps.value.split("\n").map(s => s.trim()).filter(Boolean);
    const r = await api("/api/peptides/junctions", { body: { epitopes: list, linker: linker.value } });
    if (r.error) { out2.replaceChildren(el("div", { class: "note warn" }, r.error)); return; }
    out2.replaceChildren(el("div", { class: "card" },
      el("div", { class: "diff" }, r.construct),
      el("p", { class: "sub", style: "margin-top:10px" },
        el("b", {}, r.total_novel_peptides + " junction-spanning peptides"),
        " across " + r.junctions.length + " junctions · linker " + r.linker + " (" + r.linker_note + ")"),
      el("div", { class: "note warn" }, r.verdict),
      ...r.junctions.map((j, i) => el("div", { class: "hit" },
        el("div", { class: "m" }, `junction ${i + 1}: ${j.left} | ${j.linker} | ${j.right} — ${j.n_novel} novel`),
        el("div", { class: "mono", style: "font-size:12px;color:var(--muted)" },
          j.novel_peptides.slice(0, 14).join("  ") + (j.n_novel > 14 ? " …" : ""))))));
  }

  async function checkHla() {
    const r = await api("/api/hla", { body: { allele: allele.value } });
    out3.replaceChildren(el("div", { class: "card" },
      el("div", {}, el("span", { class: "pill " + (r.valid ? "ok" : "bad") },
        r.valid ? "valid" : "not usable"), " ",
        el("b", { class: "mono" }, r.normalized || r.input)),
      r.mhc_class && el("div", { class: "m", style: "margin-top:6px" },
        "class " + r.mhc_class + (r.resolution ? " · " + r.resolution : "")),
      r.note && el("div", { class: "note " + (r.valid ? "" : "warn") }, r.note)));
  }

  into(T, [
    ...head("Peptide tools", "The operations around the models — where an off-by-one "
      + "silently produces a peptide that does not exist."),
    el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Mutant peptide windows"),
      prot,
      el("div", { class: "row", style: "margin-top:9px" }, pos, mut, wt,
        el("button", { class: "btn primary", onclick: windows }, "Generate")),
      el("div", { class: "note" },
        "Positions are 1-based, as variants are written everywhere in biology. "
        + "Supplying the expected wild-type residue catches transcript/isoform mismatches, "
        + "which otherwise produce confident predictions for peptides that do not exist.")),
    out1,
    el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Junctional neoepitopes"),
      eps,
      el("div", { class: "row", style: "margin-top:9px" }, linker,
        el("button", { class: "btn primary", onclick: junctions }, "Analyse construct")),
      el("div", { class: "note" },
        "String epitopes together and the sequence spanning each junction can itself bind MHC — "
        + "a peptide present in your vaccine and in no tumor cell. This enumerates them; "
        + "feed the list to a binding predictor to see which matter.")),
    out2,
    el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "HLA allele check"),
      el("div", { class: "row" }, allele,
        el("button", { class: "btn primary", onclick: checkHla }, "Normalize")),
      out3),
  ]);
}

  busy(T);
  const d = await api("/api/today");
  const s = d.stats || {}, sci = d.science || {};
  const nodes = [...head("Today", "What changed, what needs a decision, and what the work needs next."),
                 voiceConsole()];

  // 1. What the WORK needs — before anything about the literature. The most
  //    common failure of a research tool is telling you about papers when what
  //    you actually owe is a result you never wrote down.
  const next = d.next || [];
  nodes.push(el("div", { class: "card" },
    el("h2", { style: "margin-top:0" }, "What the work needs"),
    next.length ? next.slice(0, 6).map(n => el("div", { class: "hit" },
      el("div", { class: "t" }, el("span", { class: "pill acc" }, n.kind), " ", n.what),
      el("div", { class: "m" }, n.why, n.project ? " · " + n.project : ""))) :
      el("div", { class: "empty" },
        sci.projects ? "Nothing outstanding." :
        "No projects yet. Open one in Projects — the brain works much better when it knows what you are trying to find out."),
  ));

  // 2. What needs YOUR decision.
  const ny = d.needs_you || {};
  const decisions = (ny.proposals || []).length + (ny.conflicts || []).length + (ny.beliefs_due || []).length;
  if (decisions) {
    nodes.push(el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Needs your decision"),
      (ny.proposals || []).map(x => el("div", { class: "hit" },
        el("div", { class: "t" }, el("span", { class: "pill warn" }, "memory edit"), " ", x.target),
        el("div", { class: "m" }, x.rationale))),
      (ny.conflicts || []).map(x => el("div", { class: "hit" },
        el("div", { class: "t" }, el("span", { class: "pill bad" }, "possible contradiction"), " ", x.claim),
        el("div", { class: "m" }, x.cue))),
      (ny.beliefs_due || []).map(x => el("div", { class: "hit" },
        el("div", { class: "t" }, el("span", { class: "pill" }, "belief due"), " ", x.claim))),
      el("div", { class: "row", style: "margin-top:10px" },
        el("button", { class: "btn sm primary", onclick: () => go("memory") }, "Go to Memory")),
    ));
  }

  // 3. Standing rules — things you already told it.
  if ((d.rules || []).length) {
    nodes.push(el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Rules you have taught it"),
      d.rules.map(r => el("div", { class: "hit" },
        el("div", { class: "s" }, el("b", {}, "When "), r.trigger, " → ", r.action)))));
  }

  // 4. Corpus state, compact — the least important thing on this page.
  nodes.push(el("div", { class: "grid g4" },
    el("div", { class: "stat" }, el("div", { class: "n" }, num(sci.hypotheses_open || 0)),
      el("div", { class: "l" }, "open hypotheses")),
    el("div", { class: "stat" }, el("div", { class: "n" }, num(sci.awaiting_result || 0)),
      el("div", { class: "l" }, "awaiting a result")),
    el("div", { class: "stat" }, el("div", { class: "n" }, num(s.papers || 0)),
      el("div", { class: "l" }, "papers"), el("div", { class: "h" }, num(s.journal || 0) + " memories")),
    el("div", { class: "stat" }, el("div", { class: "n" }, num(s.cards_due || 0)),
      el("div", { class: "l" }, "cards due")),
  ));

  if (d.changed?.digest) {
    nodes.push(el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "New in the literature — " + (d.changed.digest_date || "")),
      el("div", { class: "scroll" }, el("pre", { class: "md" }, d.changed.digest))));
  }
  if ((d.recent_memory || []).length) {
    nodes.push(el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Recently remembered"),
      d.recent_memory.map(m => el("div", { class: "hit" },
        el("div", { class: "m" }, el("span", { class: "pill" }, m.kind), " ",
          String(m.at).slice(0, 10)),
        el("div", { class: "s" }, m.text)))));
  }

  into(T, nodes);
  refreshBadges(s, sci);
}


// --------------------------------------------------------------- research
// Keywords → clarifying questions → federated search → screening → export.
// Distinct from Ask (which answers from what you already have) and from the
// nightly sweep (which watches a standing interest profile).
async function viewResearch(T) {
  const state = { keywords: "", facets: [], answers: {}, plan: null, results: [] };
  const stepBox = el("div", {});
  const out = el("div", {});

  function stepKeywords() {
    const kw = el("input", { placeholder: "keywords — e.g. neoantigen vaccine pancreatic",
      value: state.keywords, onkeydown: e => { if (e.key === "Enter") go1(); } });
    async function go1() {
      state.keywords = kw.value.trim();
      if (!state.keywords) return;
      busy(stepBox, "working out what to ask you");
      const r = await api("/api/discover/clarify", { body: { keywords: state.keywords } });
      state.facets = r.facets || [];
      stepQuestions();
    }
    stepBox.replaceChildren(el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "1 · What are you looking for?"),
      el("div", { class: "row" }, kw,
        el("button", { class: "btn primary", onclick: go1 }, "Next"),
        voiceButton(v => { kw.value = v; go1(); })),
      el("div", { class: "note" },
        "Two keywords are almost never a query. The next step asks only what your "
        + "keywords have not already answered.")));
    out.replaceChildren();
  }

  function stepQuestions() {
    const controls = state.facets.map(f => {
      const box = el("div", { class: "card" },
        el("div", { style: "font-weight:600;margin-bottom:4px" }, f.question),
        el("div", { class: "m", style: "font-size:12.5px;color:var(--faint);margin-bottom:9px" }, f.why));
      if (f.id === "extra") {
        const inp = el("input", { placeholder: "e.g. ELISpot, MC38, immunopeptidomics — or leave blank",
          oninput: e => { state.answers[f.id] = e.target.value; } });
        box.append(inp);
      } else {
        const row = el("div", { class: "row" });
        for (const o of f.options) {
          const btn = el("button", { class: "btn sm", onclick: () => {
            if (f.multi) {
              const cur = new Set(state.answers[f.id] || []);
              cur.has(o.value) ? cur.delete(o.value) : cur.add(o.value);
              state.answers[f.id] = [...cur];
            } else {
              state.answers[f.id] = o.value;
            }
            row.querySelectorAll("button").forEach(bb => {
              const sel = f.multi ? (state.answers[f.id] || []).includes(bb.dataset.v)
                                  : state.answers[f.id] === bb.dataset.v;
              bb.className = "btn sm" + (sel ? " primary" : "");
            });
          } }, o.label);
          btn.dataset.v = o.value;
          row.append(btn);
        }
        box.append(row);
      }
      return box;
    });

    async function run() {
      busy(out, "searching OpenAlex, PubMed, Europe PMC");
      const plan = await api("/api/discover/plan",
        { body: { keywords: state.keywords, answers: state.answers } });
      state.plan = plan;
      const r = await api("/api/discover/search",
        { body: { plan, per_source: 50 } });
      state.results = r.results || [];
      renderResults(r);
    }

    stepBox.replaceChildren(el("div", {},
      el("div", { class: "card" },
        el("div", { class: "row", style: "justify-content:space-between" },
          el("div", {}, el("b", {}, "Searching for: "), state.keywords),
          el("button", { class: "btn sm", onclick: stepKeywords }, "change"))),
      ...controls,
      el("div", { class: "card" },
        el("div", { class: "row" },
          el("button", { class: "btn primary", onclick: run }, "Search every journal"),
          el("button", { class: "btn", onclick: run }, "Skip — search now")),
        el("div", { class: "note" },
          "Runs against OpenAlex (~250M works, every journal), PubMed, Europe PMC "
          + "and the preprint servers at once, then merges duplicates."))));
  }

  function renderResults(r) {
    const c = r.counts || {};
    const incl = el("input", { placeholder: "inclusion terms (comma separated)" });
    const excl = el("input", { placeholder: "exclusion terms (comma separated)" });
    const list = el("div", {});

    const card = rec => {
      const dl = el("div", {});
      return el("div", { class: "card" },
        el("div", { class: "t", style: "font-weight:600" },
          rec.url ? el("a", { href: rec.url, target: "_blank", rel: "noopener" }, rec.title) : rec.title),
        el("div", { class: "m", style: "margin:5px 0" },
          rec.authors ? (rec.authors.split(",").slice(0, 6).join(", ")
            + (rec.n_authors > 6 ? ` … +${rec.n_authors - 6}` : "")) : "authors unknown"),
        el("div", { class: "m" },
          el("i", {}, rec.journal || "—"), " · ", String(rec.pub_date || "").slice(0, 4),
          rec.cited_by ? ` · cited ${rec.cited_by}×` : "",
          " · ", el("span", { class: "pill " + (rec.is_oa ? "ok" : "") },
            rec.is_oa ? "open access" : "paywalled"),
          (rec.found_by || []).length > 1
            ? el("span", { class: "pill acc", style: "margin-left:5px" },
                "found by " + rec.found_by.length + " sources") : null,
          rec.screen ? el("span", { class: "pill " + (rec.screen === "include" ? "ok" :
            rec.screen === "exclude" ? "bad" : "warn"), style: "margin-left:5px" }, rec.screen) : null),
        rec.abstract ? el("details", { style: "margin-top:8px" },
          el("summary", { style: "cursor:pointer;font-size:13px;color:var(--accent-text)" }, "abstract"),
          el("div", { class: "s", style: "margin-top:6px" }, rec.abstract.slice(0, 1800)))
          : el("div", { class: "m" }, "no abstract available"),
        (rec.screen_reasons || []).length
          ? el("div", { class: "m", style: "margin-top:6px" }, rec.screen_reasons.join("; ")) : null,
        el("div", { class: "row", style: "margin-top:9px" },
          rec.pdf_url ? el("button", { class: "btn sm primary", onclick: async () => {
            dl.replaceChildren(el("span", { class: "spin" }));
            const d = await api("/api/discover/download", { body: { record: rec } });
            dl.replaceChildren(el("div", { class: "note" + (d.ok ? "" : " warn") },
              d.ok ? `saved → ${d.path}` : `${d.reason}. ${d.next || ""}`));
          } }, "Download PDF") : null,
          rec.url ? el("a", { class: "btn sm", href: rec.url, target: "_blank",
            rel: "noopener", style: "display:inline-block;text-decoration:none" }, "Open") : null,
          el("button", { class: "btn sm", onclick: async () => {
            const d = await api("/api/discover/ingest", { body: { records: [rec] } });
            dl.replaceChildren(el("div", { class: "note" }, `added to your corpus — ${d.note}`));
          } }, "Add to my corpus")),
        dl);
    };

    const paint = rows => list.replaceChildren(...rows.slice(0, 60).map(card));

    async function rescreen() {
      busy(out, "screening");
      const rr = await api("/api/discover/search", { body: {
        plan: state.plan, per_source: 50,
        include_terms: incl.value.split(",").map(x => x.trim()).filter(Boolean),
        exclude_terms: excl.value.split(",").map(x => x.trim()).filter(Boolean) } });
      state.results = rr.results || [];
      renderResults(rr);
    }

    async function doExport(fmt) {
      const e = await api("/api/discover/export",
        { body: { results: state.results, format: fmt } });
      const w = window.open("", "_blank");
      if (w) { w.document.write("<pre>" + esc(e.text) + "</pre>"); w.document.close(); }
      else navigator.clipboard?.writeText(e.text);
    }

    out.replaceChildren(el("div", {},
      el("div", { class: "card" },
        el("div", { class: "grid g4" },
          el("div", { class: "stat" }, el("div", { class: "n" }, num(c.unique || 0)),
            el("div", { class: "l" }, "unique papers"),
            el("div", { class: "h" }, num(c.retrieved || 0) + " retrieved, duplicates merged")),
          el("div", { class: "stat" }, el("div", { class: "n" }, num(c.open_access || 0)),
            el("div", { class: "l" }, "open access")),
          el("div", { class: "stat" }, el("div", { class: "n" }, num(c.with_pdf || 0)),
            el("div", { class: "l" }, "PDF fetchable")),
          el("div", { class: "stat" },
            el("div", { class: "n", style: "font-size:15px;line-height:1.5;font-weight:500" },
              Object.entries(c.per_source || {}).map(([k, v]) => `${k}: ${v}`).join("\n") || "—"),
            el("div", { class: "l" }, "per source"))),
        (r.errors || []).length ? el("div", { class: "note warn" }, r.errors.join(" · ")) : null,
        (state.plan?.narrowing || []).length ? el("div", { class: "note" },
          "Narrowed by: " + state.plan.narrowing.join(" · ")) : null,
        el("div", { class: "diff", style: "margin-top:8px" }, state.plan?.query || "")),
      el("div", { class: "card" },
        el("h2", { style: "margin-top:0" }, "Screen these results"),
        el("div", { class: "row" }, incl, excl,
          el("button", { class: "btn primary", onclick: rescreen }, "Apply")),
        el("div", { class: "note" },
          "Nothing is discarded — excluded records stay with their reason, so the "
          + "screen is auditable and reversible."),
        el("div", { class: "row", style: "margin-top:8px" },
          el("span", { class: "m" }, "export:"),
          ...["bibtex", "ris", "csv", "markdown"].map(f =>
            el("button", { class: "btn sm", onclick: () => doExport(f) }, f)))),
      list));
    paint(state.results);
  }

  into(T, ...head("Research",
    "Keywords in, a screened and citable list of publications out — across every "
    + "journal, deduplicated, with free full text where it legally exists."),
    stepBox, out);
  stepKeywords();
}

// ------------------------------------------------------------------- voice
// Web Speech API: no dependency, no key, works in Chrome/Edge. See the privacy
// note in the UI — recognition is cloud-backed in those browsers.
const VOICE_OK = "webkitSpeechRecognition" in window || "SpeechRecognition" in window;

function voiceButton(onResult, label = "🎤") {
  if (!VOICE_OK) return null;
  const btn = el("button", { class: "btn", title: "dictate", style: "min-width:44px" }, label);
  let rec = null, listening = false;
  btn.addEventListener("click", () => {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (listening && rec) { rec.stop(); return; }
    rec = new Rec();
    rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = false;
    let finalText = "";
    rec.onstart = () => { listening = true; btn.textContent = "◉"; btn.classList.add("primary"); };
    rec.onresult = e => {
      finalText = "";
      for (let i = 0; i < e.results.length; i++) finalText += e.results[i][0].transcript;
      btn.title = finalText;
    };
    rec.onerror = e => { btn.textContent = "⚠"; btn.title = "speech error: " + e.error; };
    rec.onend = () => {
      listening = false; btn.textContent = label; btn.classList.remove("primary");
      if (finalText.trim()) onResult(finalText.trim());
    };
    rec.start();
  });
  return btn;
}

function speak(text) {
  if (!("speechSynthesis" in window) || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).slice(0, 1200));
  u.rate = 1.05; u.lang = "en-GB";
  window.speechSynthesis.speak(u);
}

/* The voice console on Today: speak a command, it routes to the right tab and
   reads the answer back. Deliberately a small, fixed command grammar rather
   than free-form intent guessing — a voice interface that mishears "exclude"
   as "include" and silently acts on it is worse than no voice interface. */
const VOICE_COMMANDS = [
  { re: /^(what('s| is)? )?next\b|what should i do/i, run: async () => {
      const d = await api("/api/today");
      const n = (d.next || [])[0];
      return n ? `${n.kind}: ${n.what}. ${n.why}` : "Nothing outstanding.";
    } },
  { re: /^(search|find|research)\s+(.*)/i, run: async (m) => {
      location.hash = "research"; go("research");
      return `Opening research for ${m[2]}. I'll ask a few questions to narrow it.`;
    } },
  { re: /^(check|verify)\s+(.*)/i, run: async (m) => {
      const r = await api("/api/check", { body: { claim: m[2] } });
      return `${r.verdict.replace(/-/g, " ")}. ${r.note}`;
    } },
  { re: /^(ask|answer|explain)\s+(.*)/i, run: async (m) => {
      const r = await api("/api/answer", { params: { q: m[2] } });
      return `${r.evidence_strength}. ${r.n_passages} passages from ${r.n_sources} sources.`;
    } },
  { re: /^remember\s+(.*)/i, run: async (m) => {
      await api("/api/journal", { body: { text: m[1], kind: "observation", importance: 3 } });
      return "Recorded permanently.";
    } },
  { re: /^(open|go to)\s+(today|ask|research|projects|library|bench|memory)/i,
    run: async (m) => { go(m[2].toLowerCase()); return `Opening ${m[2]}.`; } },
];

function voiceConsole() {
  const transcript = el("div", { class: "m", style: "min-height:20px" });
  const reply = el("div", {});
  const speakBack = el("input", { type: "checkbox", checked: "", style: "width:auto" });

  async function handle(text) {
    transcript.textContent = "“" + text + "”";
    for (const c of VOICE_COMMANDS) {
      const m = text.match(c.re);
      if (m) {
        reply.replaceChildren(el("span", { class: "spin" }));
        const answer = await c.run(m);
        reply.replaceChildren(el("div", { class: "note" }, answer));
        if (speakBack.checked) speak(answer);
        return;
      }
    }
    reply.replaceChildren(el("div", { class: "note warn" },
      "I did not recognise that command. Try: “what's next”, “search KRAS G12D vaccine”, "
      + "“check <a sentence>”, “ask <a question>”, “remember <something>”, or “open projects”."));
  }

  if (!VOICE_OK) {
    return el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Voice"),
      el("div", { class: "note warn" },
        "This browser has no Web Speech API. Chrome or Edge support it; Firefox and "
        + "Safari do not, and there is no polyfill worth having."));
  }

  return el("div", { class: "card" },
    el("div", { class: "row", style: "justify-content:space-between" },
      el("h2", { style: "margin:0" }, "Voice console"),
      el("label", { class: "row", style: "gap:5px;font-size:12.5px;color:var(--muted)" },
        speakBack, "read replies aloud")),
    el("div", { class: "row", style: "margin-top:10px" },
      voiceButton(handle, "🎤  Hold a conversation"),
      ...["what's next", "open research", "open projects"].map(cmd =>
        el("button", { class: "btn sm", onclick: () => handle(cmd) }, cmd))),
    transcript, reply,
    el("div", { class: "note warn" },
      "Privacy: Chrome and Edge send audio to a cloud service for recognition. That is "
      + "fine for “what's next” and poor for dictating unpublished results. For fully "
      + "local speech, run Whisper locally — see docs/DEPLOYMENT.md. Text-to-speech is "
      + "on-device and always private."),
    el("div", { class: "note" },
      "Commands: what's next · search <terms> · check <sentence> · ask <question> · "
      + "remember <something> · open <tab>"));
}

      el("div", { class: "card" },
        el("div", { class: "row", style: "justify-content:space-between" },

function panelCheck(T) {

    (r.passages || []).length ? el("div", {},
      el("div", { class: "m", style: "margin:10px 0 4px;font-size:12px;color:var(--faint)" },
        "PASSAGES THAT BEAR ON THIS — read them; the verdict only tells you where to look"),
      ...r.passages.slice(0, 4).map(x => el("div", { class: "hit" },
        el("div", { class: "t" },
          x.url ? el("a", { href: x.url, target: "_blank", rel: "noopener" }, x.title) : x.title,
          x.tier !== null && x.tier !== undefined ? " " : "",
          x.tier !== null && x.tier !== undefined
            ? el("span", { class: "pill " + (x.tier >= 4 ? "ok" : "") }, "tier " + x.tier + "/5") : null),
        (x.signals?.notes || []).length
          ? el("div", { class: "m" }, x.signals.notes.join("; ")) : null,
        el("div", { class: "s" }, x.passage)))) : null,
    el("div", { class: "note" }, r.method));

  async function run(draft) {
    if (!box.value.trim()) return;
    busy(out, "checking against your corpus");
    const r = await api("/api/check", { body: { claim: box.value, draft: !!draft } });
    out.replaceChildren(r.checks
      ? el("div", {}, r.checks.length
          ? r.checks.map(renderOne)
          : el("div", { class: "card" }, el("div", { class: "empty" },
              "No checkable factual sentences found in that text.")))
      : renderOne(r));
  }

  into(T, el("div", { class: "card" }, box,
    el("div", { class: "row", style: "margin-top:9px" },
      el("button", { class: "btn primary", onclick: () => run(false) }, "Check this claim"),
      el("button", { class: "btn", onclick: () => run(true) }, "Check every sentence")),
    el("div", { class: "note warn" },
      "This is lexical analysis over YOUR corpus, not entailment detection and not " +
      "a truth test. It reliably tells you when your corpus says nothing, when a " +
      "number has no source, and which passages to read before you submit the sentence.")),
    out);
}

// --------------------------------------------------------------- projects
async function viewProjects(T) {
  busy(T);
  const d = await api("/api/projects");
  const out = el("div", {});

  const newProject = () => {
    const name = el("input", { placeholder: "short name, e.g. class II inclusion" });
    const question = el("input", { placeholder: "the one question this project answers" });
    return el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Open a project"),
      el("div", { class: "row" }, name, question,
        el("button", { class: "btn primary", onclick: async () => {
          if (!name.value.trim()) return;
          await api("/api/projects/create", { body: { name: name.value, question: question.value } });
          viewProjects(T);
        } }, "Create")),
      el("div", { class: "note" },
        "A project is a question you are trying to answer, not a folder. Everything " +
        "else — hypotheses, experiments, decisions, the evidence you link — hangs off it."));
  };

  const hypForm = (projectId) => {
    const st = el("input", { placeholder: "hypothesis: a statement that could be wrong" });
    const fals = el("input", { placeholder: "falsifier: what observation would make you abandon it?" });
    const err = el("div", {});
    return el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Add a hypothesis"),
      st, el("div", { style: "height:8px" }), fals,
      el("div", { class: "row", style: "margin-top:9px" },
        el("button", { class: "btn primary", onclick: async () => {
          const r = await api("/api/hypothesis", { body: {
            statement: st.value, falsifier: fals.value, project_id: projectId } });
          if (r.error) err.replaceChildren(el("div", { class: "note warn" }, r.error));
          else viewProjects(T);
        } }, "Add")),
      el("div", { class: "note" },
        "The falsifier is required. A hypothesis you cannot imagine disconfirming is " +
        "a belief — record it in Memory instead, where it gets reviewed against the literature."),
      err);
  };

  const expForm = (projectId, hypothesisId) => {
    const title = el("input", { placeholder: "experiment title" });
    const design = el("input", { placeholder: "design: model, groups, n, endpoint" });
    const pred = el("textarea", { placeholder:
      "prediction — specific enough that the result could contradict it", style: "min-height:64px" });
    const err = el("div", {});
    return el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, "Plan an experiment"),
      title, el("div", { style: "height:8px" }), design,
      el("div", { style: "height:8px" }), pred,
      el("div", { class: "row", style: "margin-top:9px" },
        el("button", { class: "btn primary", onclick: async () => {
          const r = await api("/api/experiment", { body: { title: title.value,
            design: design.value, prediction: pred.value,
            project_id: projectId, hypothesis_id: hypothesisId } });
          if (r.error) err.replaceChildren(el("div", { class: "note warn" }, r.error));
          else viewProjects(T);
        } }, "Register")),
      el("div", { class: "note" },
        "The prediction is recorded now, before the result exists. This is " +
        "pre-registration at the scale of one bench scientist: it costs thirty " +
        "seconds and it is the difference between “we found what we expected” " +
        "and knowing whether you actually did."),
      err);
  };

  const resultForm = (exp) => {
    const res = el("textarea", { placeholder: "what actually happened", style: "min-height:64px" });
    const outcome = el("select", {}, ...["as_predicted", "contradicted", "ambiguous", "failed"]
      .map(o => el("option", { value: o }, o.replace("_", " "))));
    const fb = el("div", {});
    return el("div", { class: "card" },
      el("div", { class: "m" }, "Predicted: ", el("b", {}, exp.prediction)),
      res, el("div", { class: "row", style: "margin-top:9px" }, outcome,
        el("button", { class: "btn primary", onclick: async () => {
          const r = await api("/api/experiment/update", { body: {
            id: exp.id, result: res.value, outcome: outcome.value } });
          fb.replaceChildren(el("div", { class: "note warn" }, r.prompt || "recorded"));
          setTimeout(() => viewProjects(T), 2200);
        } }, "Record result")),
      fb);
  };

  const nodes = [...head("Projects",
    "The work: what you are trying to find out, what you predicted, and what actually happened.")];

  if (!(d.projects || []).length) {
    nodes.push(el("div", { class: "card" }, el("div", { class: "empty" },
      "No projects yet. This is the part that makes NeoBrain your brain rather than a literature tool — " +
      "without it, nothing knows what you are trying to find out.")));
    nodes.push(newProject());
  } else {
    for (const proj of d.projects) {
      const detail = el("div", {});
      nodes.push(el("div", { class: "card" },
        el("div", { class: "row", style: "justify-content:space-between" },
          el("div", {}, el("b", { style: "font-size:16px" }, proj.name),
            el("div", { class: "sub", style: "margin:4px 0 0" }, proj.question || "")),
          el("div", { class: "row" },
            el("span", { class: "pill" }, (proj.counts?.open_hypotheses || 0) + " open"),
            el("span", { class: "pill " + ((proj.counts?.awaiting_result || 0) ? "warn" : "") },
              (proj.counts?.awaiting_result || 0) + " awaiting result"),
            (proj.counts?.surprises || 0)
              ? el("span", { class: "pill bad" }, proj.counts.surprises + " surprises") : null)),
        el("div", { class: "row", style: "margin-top:10px" },
          el("button", { class: "btn sm", onclick: async () => {
            const st = await api("/api/projects", { params: { id: proj.id } });
            detail.replaceChildren(
              ...(st.hypotheses || []).map(h => el("div", { class: "card" },
                el("div", { class: "t" }, el("span", { class: "pill " +
                  (h.status === "open" ? "" : h.status === "refuted" ? "bad" : "ok") }, h.status),
                  " ", h.statement),
                el("div", { class: "m" }, "falsified by: ", h.falsifier || "—"),
                ...(h.experiments || []).map(x => el("div", { class: "m" },
                  `  experiment #${x.id} ${x.title} — ${x.status}` +
                  (x.outcome ? ` (${x.outcome})` : ""))),
                expForm(proj.id, h.id))),
              ...(st.experiments || []).filter(x => x.status === "running" && !x.result)
                .map(x => el("div", {},
                  el("h2", {}, "Result for #" + x.id + " " + x.title), resultForm(x))),
              hypForm(proj.id));
          } }, "Open"))),
        detail);
    }
    nodes.push(newProject());
  }
  into(T, nodes);
}

// ------------------------------------------------------------------ bench
function panelClinic(T) {
  const tumour = el("input", { placeholder: "tumour type, e.g. pancreatic adenocarcinoma" });
  const variants = el("input", { placeholder: "variants, comma separated: KRAS G12D, TP53 R175H" });
  const hla = el("input", { placeholder: "HLA, comma separated: HLA-A*02:01, HLA-C*08:02" });
  const tmb = el("input", { placeholder: "TMB /Mb (optional)", type: "number" });
  const msi = el("input", { placeholder: "MSI status (optional)" });
  const out = el("div", {});

  async function run() {
    busy(out, "screening");
    const r = await api("/api/clinic/screen", { body: {
      tumour_type: tumour.value,
      variants: variants.value.split(",").map(x => x.trim()).filter(Boolean),
      hla: hla.value.split(",").map(x => x.trim()).filter(Boolean),
      tmb: tmb.value ? Number(tmb.value) : null, msi: msi.value } });
    out.replaceChildren(el("div", {},
      el("div", { class: "card" },
        el("h2", { style: "margin-top:0" }, "Actionability (ESCAT)"),
        el("table", {}, el("tr", {}, ...["tier", "alteration", "meaning"].map(h => el("th", {}, h))),
          ...(r.actionability || []).map(a => el("tr", {},
            el("td", {}, el("span", { class: "pill " +
              (/^I/.test(a.escat) ? "ok" : /^II/.test(a.escat) ? "warn" : "") }, a.escat)),
            el("td", {}, a.variant),
            el("td", {}, el("div", {}, a.escat_meaning),
              el("div", { class: "m", style: "margin-top:4px" }, a.note)))))),
      (r.flags || []).length ? el("div", { class: "card" },
        el("h2", { style: "margin-top:0" }, "Flags"),
        ...r.flags.map(f => el("div", { class: "note warn" }, f))) : null,
      el("div", { class: "card" },
        el("h2", { style: "margin-top:0" }, `Candidate trials (${(r.trials || []).length})`),
        (r.trials || []).length ? (r.trials).map(t => el("div", { class: "hit" },
          el("div", { class: "t" }, el("a", { href: t.url, target: "_blank", rel: "noopener" },
            t.nct_id), " — ", t.title),
          el("div", { class: "m" }, t.status, " · ", t.phase || "phase n/a", " · ", t.sponsor),
          el("div", { class: "s" }, "matched because: ", (t.why || []).join(", "))))
          : el("div", { class: "empty" }, r.corpus?.note || "No matches."),
        el("div", { class: "note warn" }, (r.limits || []).join(" "))),
    ));
  }

  into(T, el("div", { class: "card" },
    el("div", { class: "note warn" },
      "A SEARCH AID, NOT AN ELIGIBILITY DETERMINATION. Nothing here is a treatment " +
      "recommendation. Use de-identified profiles only."),
    tumour, el("div", { style: "height:8px" }), variants,
    el("div", { style: "height:8px" }), hla,
    el("div", { class: "row", style: "margin-top:8px" }, tmb, msi,
      el("button", { class: "btn primary", onclick: run }, "Screen"))), out);
}

function go(name) {
  document.querySelectorAll("nav button[data-v]").forEach(b =>
    b.classList.toggle("on", b.dataset.v === name));
  location.hash = name;
  (VIEWS[name] || viewToday)(null);
}
document.querySelectorAll("nav button[data-v]").forEach(b =>
  b.addEventListener("click", () => go(b.dataset.v)));
window.addEventListener("hashchange", () => go(location.hash.slice(1) || "today"));
go(location.hash.slice(1) || "today");
